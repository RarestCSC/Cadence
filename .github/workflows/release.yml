name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Match tag and Cargo versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          version="$manifest_version"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release tag must use the form vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if [[ "$version" != "$manifest_version" ]]; then
              echo "tag version $version does not match Cargo version $manifest_version" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-deb:
    name: Linux deb amd64
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install system build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libvulkan1 \
            pkg-config

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal

      - name: Restore Rust build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-${{ runner.arch }}-

      - name: Build deb
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: packaging/build-deb.sh "$VERSION" amd64 dist

      - name: Upload deb release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-amd64
          path: dist/cadence-v${{ needs.validate.outputs.version }}-linux-amd64.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    if: github.event_name == 'push'
    needs:
      - validate
      - build-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-draft.txt 2>/dev/null; then
            if [[ "$(cat release-draft.txt)" != "true" ]]; then
              echo "release $TAG is already published; refusing to replace its assets" >&2
              exit 1
            fi
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --draft \
              --generate-notes \
              --title "Cadence $TAG" \
              --verify-tag
          fi
